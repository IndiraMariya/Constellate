[package]
name = "constellate"
version = "1.0.0"
description = "Constellate — a calm task app where tasks are stars"
authors = ["Indira"]
edition = "2021"

# The library that both desktop (main.rs) and mobile entry points call into.
[lib]
name = "constellate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Applies the native macOS "vibrancy" (frosted glass) effect to the window.
window-vibrancy = "0.6"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
